# 法拍房全生命周期分析库配置文件
# 复制为 config.toml 后按需修改：cp config.example.toml config.toml

[storage]
# SQLite 分析库路径（相对路径基于当前工作目录，也可填绝对路径）
db_path = "data/fph.db"
# 默认导出目录
export_dir = "exports"

[provider]
# 当前启用的采集后端：taobao_ego（复用本机 ego(lite) / ego-browser 登录态）
name = "taobao_ego"
# ego-browser 可执行命令（默认从 PATH 查找；Windows 如找不到可填完整路径）
ego_browser_cmd = "ego-browser"
# ego(lite) 独立 Task Space 名称（后台静默运行，不抢占日常浏览标签页）
task_space = "fph-auction-collector"
# 单次脚本超时（秒）
timeout_seconds = 90
# 页面导航等待超时（秒）
page_timeout_seconds = 25
# 翻页/详情请求之间的随机延时区间（秒），低频防风控
min_delay_seconds = 3.0
max_delay_seconds = 7.0
# 每次同步列表最多抓取页数（按更新时间/默认排序，日常增量 3~5 页足够）
max_pages_per_query = 5
# 首次历史回填阶段单次最多翻页数（未完成近 2 年全量回填前自动放大，完成后自动切回 max_pages_per_query）
backfill_max_pages = 50
# 遇到滑块/登录验证时弹窗等待人工处理的最大秒数（默认 900 秒即 15 分钟；设为 0 则立即保存断点退出）
auth_wait_timeout_seconds = 900
# 每次运行最多补抓多少条新标的的详情与公告（避免单次请求过多）
max_detail_enrich_per_run = 20
# 每次运行最多回刷多少条已过结拍时间但未终结状态的标的
max_ended_refresh_per_run = 20
# 仅采集指定的物业类型（可选：residential / commercial / parking / industrial / land / other）
# 设为 ["residential"] 表示只采集住宅；设为 [] 表示不限制、全部采集
# 也可在单个 [[regions]] 下单独设置 allowed_property_types 覆盖全局规则
allowed_property_types = ["residential"]
# 仅采集最近 N 天的历史已结拍数据（默认 730 天即 2 年；0 表示不限制；在拍/预告不受此限）
lookback_days = 730
# 自动补抓详情/公告的目标状态（默认仅补抓在拍与预告，避免历史结拍标的触发大量详情请求；设为 [] 表示不限）
enrich_statuses = ["ongoing", "upcoming"]
# 已结束列表整页均已入库且为终态（或超期）时提前停止翻页，减少重复请求
stop_on_known_ended_page = true
# 详情补抓与结拍回刷的最大失败重试次数与冷却时间（小时），防死循环请求
max_detail_attempts = 3
max_refresh_attempts = 3
retry_cooldown_hours = 12
# 结拍回刷仅追踪结拍时间在近 N 天内且尚未进入终态的标的
ended_refresh_window_days = 30

[schedule]
# 定时常驻模式下的执行间隔（分钟），默认每 6 小时执行一次
interval_minutes = 360
# 每次调度附带的随机抖动（分钟），避免固定整点请求
jitter_minutes = 15
# 每次定时同步是否自动补抓新标的详情与公告
auto_enrich_details = true
# 每次定时同步是否自动回刷已结拍标的最终成交价
auto_refresh_ended = true

# 默认监控区域：福建省福州市 + 福建省龙岩市（住宅用房 category=50025969）
# status_scopes:
#   - "active" : 正在进行 + 即将开始（日常捡漏监控）
#   - "ended"  : 已结束（持续积累全量成交/流拍行情数据）

[[regions]]
name = "福州市-住宅"
province = "福建"
city = "福州"
location_code = "350100"
category = "50025969"
status_scopes = ["active", "ended"]
# 如需直接指定淘宝筛选页 URL，可取消注释并粘贴完整链接（不带 page 参数）：
# custom_url = "https://sf.taobao.com/list/50025969.htm?location_code=350100"

[[regions]]
name = "龙岩市-住宅"
province = "福建"
city = "龙岩"
location_code = "350800"
category = "50025969"
status_scopes = ["active", "ended"]

# 京东司法拍卖监控区域（住宅用房 jd_category_id=12728）
[[regions]]
name = "福州市-住宅-京东"
provider = "jd_ego"
province = "福建"
city = "福州"
jd_province_id = "16"
jd_city_id = "1303"
jd_category_id = "12728"
status_scopes = ["active", "ended"]

[[regions]]
name = "龙岩市-住宅-京东"
provider = "jd_ego"
province = "福建"
city = "龙岩"
jd_province_id = "16"
jd_city_id = "1362"
jd_category_id = "12728"
status_scopes = ["active", "ended"]
